name : Start container
on :  
  workflow_dispatch:
  

jobs :
  run_container:
    runs-on: ubuntu-latest
    steps :
      - name : Login EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            docker start chatbot || true 
